apiVersion: v1
kind: Pod
metadata:
  name: memory-management-demo2
spec:
  containers:
  - name: container2
    image: polinux/stress
    resources:
      requests:
        memory: "100Mi"
      limits:
        memory: "200Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "3000M", "--vm-hang", "1"]
