apiVersion: v1
kind: Pod
metadata:
  name: memory-management-demo3
spec:
  containers:
  - name: container3
    image: polinux/stress
    resources:
      requests:
        memory: "100000Mi"
      limits: 
        memory: "100000Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
