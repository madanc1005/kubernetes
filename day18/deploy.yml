apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  labels:
    role: frontend-role
spec:
  containers:
  - name: frontend-container
    image: nginx
    ports:
    - name: http
      containerPort: 80
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    role: frontend-service-role
spec:
  selector:
    role: frontend-role
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80



---
apiVersion: v1
kind: Pod
metadata:
  name: backend-pod
  labels:
    role: backend-role
spec:
  containers:
  - name: backend-container
    image: nginx
    ports:
    - name: http
      containerPort: 80
      protocol: TCP

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    role: backend-service-role
spec:
  selector: 
    role: backend-role
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80


  

---
apiVersion: v1
kind: Pod
metadata:
  name: db-pod
  labels:
    role: db-role
spec:
  containers:
  - name: db-container
    image: mysql
    env:
    - name: "MYSQL_USER"
      value: "mysql"
    - name: "MYSQL_PASSWORD"
      value: "mysql"
    - name: "MYSQL_DATABASE"
      value: "testdb"
    - name: "MYSQL_ROOT_PASSWORD"
      value: "verysecure"
    ports:
    - name: mysql
      containerPort: 3306
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  labels:
    role: db-service-role
spec:
  selector:
    role: db-role
  ports:
  - protocol: TCP
    targetPort: 3306
    port: 3306